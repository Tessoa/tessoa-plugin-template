name = "Counts the selected files"
command = "count-selected"

[[files]]
from = "hello.txt"

[[files]]
from = "hello.txt"
as = "copy.txt"

[[files]]
from = "hello.txt"
as = "not-selected.txt"
selected = false

[expect]
files = ["copy.txt", "hello.txt", "not-selected.txt"]
notifications = [{ title = "__PLUGIN_NAME__", body = "2 files, 24 bytes." }]
