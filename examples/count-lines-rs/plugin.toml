[plugin]
id = "com.example.count-lines"
name = "Count lines"
version = "0.1.0"
api = "tessoa:plugin@0.1.0"

[entry]
kind = "wasm"
file = "dist/plugin.wasm"

[[commands]]
id = "count-lines"
title = "Count lines"
where = ["context-menu"]
when = { ext = ["txt", "md", "csv", "log"], min-selected = 1 }

[permissions]
files = ["read-selected"]
