[plugin]
id = "com.example.count-lines-ts"
name = "Count lines"
version = "0.1.0"
api = "tessoa:plugin@0.2.0"

[entry]
kind = "js"
file = "dist/plugin.js"

[[commands]]
id = "count-lines"
title = "Count lines"
where = ["context-menu"]
when = { ext = ["txt", "md", "csv", "log"], min-selected = 1 }

[permissions]
files = ["read-selected"]
