[package]
name = "rename-by-date"
description = "Example plugin: rename the selected photos after their capture date"
edition = "2024"
version = "0.1.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tessoa-plugin-sdk = { path = "../../sdk/rust" }

# tessoa-plugin builds with --release. A panic aborts, which the sandbox
# reports as a crash of the command.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
